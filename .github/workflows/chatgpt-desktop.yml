name: ChatGPT desktop provider
on:
  push:
    branches: ['feat/chatgpt-desktop-provider']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
        working-directory: runtime
      - run: npm test && npm run build && npm run test:ui
        working-directory: runtime
      - name: Bundle provider for isolated VPS acceptance checks
        run: runtime/node_modules/.bin/esbuild runtime/src/provider.ts runtime/src/model-catalog.ts --bundle --platform=node --format=cjs --out-extension:.js=.cjs --outdir=acceptance --external:node:*
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-desktop-provider-runtime
          path: acceptance/
