name: Signed Android APK
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APK_KEYSTORE: /tmp/pocket-agent-signing.jks
      APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
      APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Build and test trimmed runtime
        working-directory: runtime
        run: npm ci && npm test && npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify subscription voice lifecycle and playback gates
        run: |
          mkdir -p /tmp/pocket-voice-sim
          javac -d /tmp/pocket-voice-sim \
            app/src/main/java/dev/pocket/agent/SubscriptionVoiceLifecycle.java \
            app/src/main/java/dev/pocket/agent/SubscriptionVoicePlaybackGate.java \
            scripts/SubscriptionVoiceLifecycleSimulator.java \
            scripts/SubscriptionVoicePlaybackGateSimulator.java \
            scripts/SubscriptionVoiceStartupSimulator.java
          java -cp /tmp/pocket-voice-sim dev.pocket.agent.SubscriptionVoiceLifecycleSimulator
          java -cp /tmp/pocket-voice-sim dev.pocket.agent.SubscriptionVoicePlaybackGateSimulator
          java -cp /tmp/pocket-voice-sim dev.pocket.agent.SubscriptionVoiceStartupSimulator
      - name: Test provider protocols, display ownership and private emulator provisioning
        run: |
          python3 -m pip install aiohttp==3.13.5
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Restore private signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path=Path(os.environ['APK_KEYSTORE'])
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True))
          path.chmod(0o600)
          PY
      - uses: gradle/actions/setup-gradle@v5
      - name: Build release, development and local-emulator test APKs
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:assembleDevelopment :app:assembleReleaseAndroidTest :app:lintRelease :fixture:assembleDebug
          ./gradlew --no-daemon -PdevEmulatorTest :app:assembleDevelopmentAndroidTest
      - name: Enable KVM hardware acceleration for emulator
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Exercise voice and development MCP contracts on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            ./gradlew --no-daemon :app:connectedReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.pocket.agent.VoicePipelineDeviceTest
            ./gradlew --no-daemon :app:connectedReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.pocket.agent.VoiceAssistantDeviceTest
            ./gradlew --no-daemon :app:connectedReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.pocket.agent.SubscriptionVoiceActivationDeviceTest
            ./gradlew --no-daemon :app:connectedReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.pocket.agent.SubscriptionVoiceContextDeviceTest
            ./gradlew --no-daemon :app:connectedReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.pocket.agent.LifecycleDeviceTest#mainThreadPromptAndDebugControlsWorkOnDevice
            adb install -r fixture/build/outputs/apk/debug/fixture-debug.apk
            ./gradlew --no-daemon :app:connectedReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.pocket.agent.RuntimeDeviceTest#physicalDisplayCanLaunchObserveAndActWithoutVirtualLease
            adb uninstall dev.pocket.agent || true
            adb uninstall dev.pocket.agent.test || true
            # PhoneTargetDeviceTest exercises the same hidden WindowManager IME policy used by
            # the privileged Shizuku shell UserService. Enable non-SDK access only on this
            # disposable emulator so instrumentation can reach that platform API too.
            adb shell settings put global hidden_api_policy 1
            ./gradlew --no-daemon -PvoiceEmulatorTest :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.pocket.agent.PhoneTargetDeviceTest
            ./gradlew --no-daemon -PvoiceEmulatorTest :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.pocket.agent.CrashResilienceDeviceTest
            adb shell settings delete global hidden_api_policy
            ./gradlew --no-daemon :android-platform:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.pocket.android.NativeAndroidApisTest#unavailableTraversalChildFailsClosed
            adb uninstall dev.pocket.agent || true
            adb uninstall dev.pocket.agent.test || true
            ./gradlew --no-daemon -PdevEmulatorTest :app:connectedDevelopmentAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.pocket.agent.DevBridgeDeviceTest
      - name: Upload emulator test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-test-report
          path: |
            app/build/outputs/androidTest-results/connected/
            android-platform/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
      - name: Collect provenance and signed APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk artifacts/Pocket-Agent-arm64.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk artifacts/Pocket-Agent-x86_64.apk
          cp app/build/outputs/apk/release/app-universal-release.apk artifacts/Pocket-Agent-universal.apk
          cp app/build/outputs/apk/development/app-arm64-v8a-development.apk artifacts/Pocket-Agent-development-arm64.apk
          cp app/build/outputs/apk/development/app-x86_64-development.apk artifacts/Pocket-Agent-development-x86_64.apk
          cp app/build/outputs/apk/development/app-universal-development.apk artifacts/Pocket-Agent-development-universal.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          for path, present in [('artifacts/Pocket-Agent-arm64.apk',False),('artifacts/Pocket-Agent-development-arm64.apk',True),('artifacts/Pocket-Agent-development-universal.apk',True)]:
              with ZipFile(path) as archive:
                  actual='lib/arm64-v8a/libngrok_java.so' in archive.namelist()
                  assert actual is present,(path,actual)
          print('Development-only ARM64 ngrok JNI packaging verified')
          PY
          cp app/build/outputs/apk/androidTest/release/*.apk artifacts/Pocket-Agent-tests.apk
          cp app/build/outputs/apk/androidTest/development/*.apk artifacts/Pocket-Agent-development-tests.apk
          cp fixture/build/outputs/apk/debug/*.apk artifacts/Pocket-Agent-fixture.apk
          cp app/build/reports/lint-results-release.txt artifacts/lint.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/Pocket-Agent-arm64.apk > artifacts/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/Pocket-Agent-development-arm64.apk > artifacts/development-signature.txt
          grep -F "$(sed -n 's/Signer #1 certificate SHA-256 digest: //p' artifacts/signature.txt | head -1)" artifacts/development-signature.txt
          git rev-parse HEAD > artifacts/source-commit.txt
          cp app/src/main/assets/runtime-manifest.json artifacts/runtime-manifest.json
          python3 scripts/native_footprint.py > artifacts/native-stripping.json
          python3 scripts/check_apk.py artifacts/Pocket-Agent-arm64.apk artifacts/Pocket-Agent-x86_64.apk artifacts/Pocket-Agent-universal.apk > artifacts/payload-report.jsonl
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
          (cd artifacts && sha256sum Pocket-Agent-x86_64.apk Pocket-Agent-tests.apk Pocket-Agent-fixture.apk > EMULATOR_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: pocket-agent-emulator-validation
          path: |
            artifacts/Pocket-Agent-x86_64.apk
            artifacts/Pocket-Agent-tests.apk
            artifacts/Pocket-Agent-fixture.apk
            artifacts/source-commit.txt
            artifacts/EMULATOR_SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: pocket-agent-release
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: pocket-agent-development
          path: |
            artifacts/Pocket-Agent-development-*.apk
            artifacts/development-signature.txt
            artifacts/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: build-diagnostics
          path: |
            app/build/reports/lint-results-release.*
            app/build/outputs/mapping/**/missing_rules.txt
          if-no-files-found: ignore
      - name: Remove signing material
        if: always()
        run: rm -f "$APK_KEYSTORE"
